<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELIN | Premium Fashion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  color:#111;
}

/* NAV */
.nav{
  position:absolute;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:25px 60px;
  color:#fff;
  z-index:10;
}

.logo{
  font-size:28px;
  font-weight:700;
  letter-spacing:3px;
  color:#facc15;
}

.nav ul{
  display:flex;
  gap:30px;
  list-style:none;
}

/* HERO */
.hero{
  height:100vh;
  background:
  linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.7)),
  url('https://i.postimg.cc/hGKL2x0B/image.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:90px;
  letter-spacing:6px;
  color:#fff;
}

.hero p{
  color:#facc15;
  margin:15px 0;
  letter-spacing:3px;
}

.hero button{
  padding:12px 35px;
  background:#fff;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

/* FEATURES */
.features{
  display:flex;
  justify-content:space-around;
  background:#111;
  color:#fff;
  padding:20px;
}

/* CATEGORY */
.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
  padding:50px;
}

.cat{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  cursor:pointer;
}

.cat img{
  width:100%;
  height:260px;
  object-fit:cover;
  transition:0.5s;
  filter:brightness(0.85);
}

.cat:hover img{
  transform:scale(1.08);
  filter:brightness(1);
}

.label{
  position:absolute;
  bottom:25px;
  left:25px;
  color:#fff;
  font-size:28px;
  font-weight:600;
}

/* PRODUCTS */
.section-title{
  text-align:center;
  font-size:26px;
  margin-top:20px;
}

.products{
  padding:50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  background:#f5f5f5;
}

.card{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card h4{
  padding:10px;
}

.price{
  padding:0 10px;
  color:#facc15;
}

.card button{
  margin:10px;
  padding:10px;
  width:90%;
  background:#111;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* FOOTER */
.footer{
  background:#111;
  color:#fff;
  padding:30px;
  text-align:center;
}

/* MOBILE */
@media(max-width:900px){
  .categories{
    grid-template-columns:1fr;
  }
  .hero h1{
    font-size:50px;
  }
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="logo">VELIN</div>
  <ul>
    <li>MEN</li>
    <li>WOMEN</li>
    <li>COLLECTIONS</li>
    <li>NEW ARRIVALS</li>
    <li>ABOUT US</li>
  </ul>
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>VELIN</h1>
    <p>STYLE THAT DEFINES YOU</p>
    <button onclick="scrollToProducts()">SHOP NOW</button>
  </div>
</section>

<!-- FEATURES -->
<div class="features">
  <div>🚚 Free Shipping</div>
  <div>↩ Easy Returns</div>
  <div>🏆 Premium Quality</div>
  <div>🔒 Secure Payments</div>
</div>

<!-- CATEGORY (YOUR IMAGES KEPT SAME) -->
<section class="categories">
  <div class="cat" onclick="showProducts('men')">
    <img src="https://i.postimg.cc/prgjtnbZ/download.jpg">
    <div class="label">MEN</div>
  </div>

  <div class="cat" onclick="showProducts('women')">
    <img src="https://i.postimg.cc/fyKb8tWp/short-girl-dressing-tips.jpg">
    <div class="label">WOMEN</div>
  </div>

  <div class="cat" onclick="showProducts('kids')">
    <img src="https://i.postimg.cc/GmMycNCy/360-F-464716593-LD9IBz-IJwl-RMw-Qzjq-Vw-HLL7Xeup-ROIl-S.jpg">
    <div class="label">KIDS</div>
  </div>
</section>

<!-- PRODUCTS -->
<h2 class="section-title">MEN COLLECTION</h2>
<div class="products" id="products"></div>

<!-- FOOTER -->
<div class="footer">
  © 2026 VELIN | Premium Fashion
</div>

<script>
const products=[
/* MEN */
{name:"T-Shirt",price:799,cat:"men",img:"https://i.postimg.cc/k54gfXLb/download.jpg"},
{name:"Shirt",price:999,cat:"men",img:"https://i.postimg.cc/4xFg4vFP/download.jpg"},
{name:"Pant",price:1200,cat:"men",img:"https://i.postimg.cc/t4JkbFxf/download.jpg"},
{name:"Kurta",price:1500,cat:"men",img:"https://i.postimg.cc/FzctD29K/download.jpg"},


/* WOMEN */
{name:"Saree",price:1499,cat:"women",img:"https://i.postimg.cc/bJfCTdBp/download.jpg"},
{name:"Lehenga",price:1999,cat:"women",img:"https://i.postimg.cc/nhL6js6P/download.jpg"},
{name:"Kurti",price:899,cat:"women",img:"https://i.postimg.cc/50m3SgzG/download.jpg"},
{name:"pant",price:499,cat:"women",img:"https://i.postimg.cc/SsZ9KvCm/download.jpg"},
{name:"jeans",price:999,cat:"women",img:"https://i.postimg.cc/6Qt4fXh9/download.jpg"},

/* KIDS */
{name:"Kids Shirt",price:499,cat:"kids",img:"https://i.postimg.cc/xTmkrCsx/images.jpg"},
{name:"Kids Dress",price:699,cat:"kids",img:"https://i.postimg.cc/bdfwYx6B/download.jpg"},
{name:"Kids Set",price:899,cat:"kids",img:"https://i.postimg.cc/7Y1zR9ZH/images.jpg"}
];

function showProducts(category){
let filtered = products.filter(p=>p.cat===category);

let html="";
filtered.forEach(p=>{
html+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
<button>Add to Cart</button>
</div>`;
});

document.getElementById("products").innerHTML=html;
document.querySelector(".section-title").innerText = category.toUpperCase()+" COLLECTION";
}

/* Default load */
showProducts("men");

function scrollToProducts(){
window.scrollTo({top:window.innerHeight,behavior:"smooth"});
}
</script>

</body>
</html>
