<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK Techmania - Cinematic Portfolio</title>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

/* BACKGROUND */
body{
  color:white;
  background: linear-gradient(-45deg,#0f2027,#2c5364,#1a2980,#26d0ce);
  background-size:400% 400%;
  animation:move 10s infinite;
}
@keyframes move{50%{background-position:100% 50%}}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#00eaff}

.navlist{display:flex;gap:25px;list-style:none}
.navlist a{
  color:white;
  text-decoration:none;
  position:relative;
}
.navlist a::after{
  content:'';
  position:absolute;
  width:0%;
  height:2px;
  bottom:-4px;
  left:0;
  background:#00eaff;
  transition:.3s;
}
.navlist a:hover::after{width:100%}

/* HERO */
.hero{
  position:relative;
  height:70vh;
}
.hero iframe{
  width:100%;
  height:100%;
  filter:brightness(0.5);
}

.hero-overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.hero-overlay h1{
  font-size:60px;
  text-shadow:0 0 20px #00eaff;
}

.hero-overlay p{
  margin-top:10px;
  font-size:18px;
  opacity:0.9;
}

/* SECTION */
.section{
  padding:80px 40px;
  text-align:center;
}

.section h2{
  font-size:36px;
  margin-bottom:10px;
}

.section p{
  opacity:0.7;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:40px;
  margin-top:50px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:25px;
  overflow:hidden;
  position:relative;
  transition:.4s;
  transform-style:preserve-3d;
}

/* SHINE EFFECT */
.card::before{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.2),transparent);
  top:0;
  left:-100%;
  transition:.5s;
}
.card:hover::before{
  left:100%;
}

.card:hover{
  transform:rotateY(8deg) scale(1.05);
  box-shadow:0 0 40px rgba(0,234,255,0.5);
}

/* IMAGE */
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* CONTENT */
.card-content{
  padding:20px;
}
.card-content h3{
  margin-bottom:5px;
}
.card-content span{
  opacity:0.7;
  font-size:14px;
}

/* BUTTON */
.btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:25px;
  background:#ff0000;
  color:white;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px red;
}

/* BACK BUTTON */
.back{
  display:block;
  margin:50px auto;
  padding:12px 25px;
  background:#00eaff;
  color:black;
  border-radius:25px;
  text-decoration:none;
  width:max-content;
  transition:.3s;
}
.back:hover{
  transform:scale(1.1);
}

/* FOOTER */
footer{
  padding:40px;
  text-align:center;
  background:rgba(0,0,0,0.3);
}
footer p{opacity:0.6}

/* MOBILE */
@media(max-width:768px){
  header{flex-direction:column;gap:10px}
  .hero-overlay h1{font-size:35px}
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo"><span>RK</span>TECHMANIA</div>
  <ul class="navlist">
    <li><a href="index.html">Home</a></li>
    <li><a href="#">Portfolio</a></li>
  </ul>
</header>

<!-- HERO -->
<section class="hero">
  <iframe src="https://www.youtube.com/embed/YCZzyO8AsfY?autoplay=1&mute=1&loop=1&playlist=YCZzyO8AsfY&controls=0"></iframe>
  <div class="hero-overlay">
    <h1>🎬 Cinematic Editing</h1>
    <p>Reels • Ads • Storytelling</p>
  </div>
</section>

<!-- SECTION -->
<section class="section">
  <h2>Explore Our Channels</h2>
  <p>Watch high quality edits and creative content</p>

  <div class="grid">

    <div class="card" onclick="openChannel('https://www.youtube.com/@kashiartgroup')">
      <img src="https://img.youtube.com/vi/AT0RdHrDW-M/maxresdefault.jpg">
      <div class="card-content">
        <h3>Kashi Art Group</h3>
        <span>Creative Edits & Reels</span>
        <button class="btn">Subscribe</button>
      </div>
    </div>

    <div class="card" onclick="openChannel('https://www.youtube.com/@Rishabh727')">
      <img src="https://img.youtube.com/vi/ysz5S6PUM-U/maxresdefault.jpg">
      <div class="card-content">
        <h3>RK Techmania</h3>
        <span>Tech & Editing Content</span>
        <button class="btn">Subscribe</button>
      </div>
    </div>

  </div>
</section>

<a href="index.html" class="back">⬅ Back to Home</a>

<!-- FOOTER -->
<footer>
  <p>© 2026 RKTECHMANIA • Designed with cinematic UI</p>
</footer>

<script>
function openChannel(url){
  window.open(url,'_blank');
}
</script>

</body>
</html>
